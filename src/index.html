<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; media-src media:; img-src media: blob:; connect-src media:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrameEdit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-lockup">
        <span class="mark" aria-hidden="true">F</span>
        <div>
          <div class="brand">FrameEdit</div>
          <div id="project-name" class="project-name">Untitled</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="open-project" class="tool-button" type="button">Open</button>
        <button id="save-project" class="tool-button" type="button">Save</button>
        <span class="v-rule" aria-hidden="true"></span>
        <label class="field">Frame
          <select id="frame-size">
            <option value="landscape">Landscape</option>
            <option value="shorts">Shorts</option>
          </select>
        </label>
        <label class="field">Size
          <select id="export-size">
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
            <option value="shorts-1080">Shorts 1080</option>
            <option value="shorts-720">Shorts 720</option>
          </select>
        </label>
        <label class="field">Quality
          <select id="export-quality">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </label>
        <button id="export-button" class="accent-button" type="button" disabled>Export</button>
      </div>
    </header>

    <main class="workspace">
      <section class="pane" aria-label="Media">
        <div class="pane-head">
          <h2 class="pane-title">Media</h2>
          <button id="import-media" class="tool-button" type="button">Import</button>
        </div>
        <div id="media-body" class="pane-body">
          <div id="media-empty" class="empty">
            <p>Import video, audio, or images. Video and images can go on Overlay.</p>
          </div>
          <ul id="media-list" class="media-list" hidden></ul>
          <p id="media-error" class="media-error" hidden></p>
        </div>
      </section>

      <section class="pane preview-pane" aria-label="Preview">
        <div class="pane-head">
          <h2 class="pane-title">Preview</h2>
          <span id="runtime" class="runtime"></span>
        </div>
        <div class="pane-body preview-body">
          <div class="preview-stage">
            <div class="preview-frame">
              <span id="preview-empty">Drop a clip on the timeline</span>
              <video id="preview-video" playsinline preload="auto"></video>
              <video id="preview-video-b" class="is-underlay" playsinline preload="auto"></video>
              <video id="overlay-video" class="is-underlay" playsinline preload="auto"></video>
              <canvas id="preview-canvas" hidden></canvas>
              <p id="preview-audio-label" class="preview-audio-label" hidden></p>
              <audio id="preview-audio"></audio>
            </div>
            <div id="export-panel" class="export-panel" hidden>
              <progress id="export-progress" max="1" value="0"></progress>
              <span id="export-label">Exporting</span>
              <button id="export-cancel" class="tool-button" type="button">Cancel</button>
            </div>
            <p id="notice" class="notice" hidden></p>
          </div>
        </div>
      </section>

      <section class="pane" aria-label="Inspector">
        <h2 class="pane-title">Inspector</h2>
        <div id="inspector" class="pane-body inspector"></div>
      </section>
    </main>

    <section class="timeline" aria-label="Timeline">
      <div class="timeline-head">
        <div class="edit-tools">
          <h2 class="pane-title">Timeline</h2>
          <button id="split-clip" class="tool-button" type="button" disabled title="Split at playhead (S)">Split</button>
          <button id="delete-clip" class="tool-button" type="button" disabled title="Delete (Delete)">Delete</button>
          <button id="copy-clip" class="tool-button" type="button" disabled title="Copy (Ctrl+C)">Copy</button>
          <button id="paste-clip" class="tool-button" type="button" disabled title="Paste (Ctrl+V)">Paste</button>
          <button id="undo" class="tool-button" type="button" disabled title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo" class="tool-button" type="button" disabled title="Redo (Ctrl+Shift+Z)">Redo</button>
        </div>
        <div class="zoom-control" title="Timeline zoom">
          <button id="zoom-out" class="tool-button" type="button" title="Zoom out">−</button>
          <input id="zoom-range" type="range" min="16" max="320" value="80" aria-label="Timeline zoom" />
          <button id="zoom-in" class="tool-button" type="button" title="Zoom in">+</button>
        </div>
        <div class="transport">
          <button id="play-toggle" class="play-button" type="button" disabled>Play</button>
          <input id="seek" type="range" min="0" max="0" value="0" step="0.01" disabled />
          <span id="timecode" class="timecode">00:00:00:00</span>
        </div>
      </div>
      <div class="timeline-body">
        <div class="track-labels">
          <div class="ruler-spacer"></div>
          <div class="track-label"><i class="swatch overlay"></i>Overlay</div>
          <div class="track-label"><i class="swatch video"></i>Video</div>
          <div class="track-label"><i class="swatch audio"></i>Audio</div>
        </div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="time-area" id="time-area">
            <div class="ruler" id="ruler"></div>
            <div class="track-lane" data-track="overlay"></div>
            <div class="track-lane" data-track="video"></div>
            <div class="track-lane" data-track="audio"></div>
            <div class="playhead" id="playhead"></div>
            <div class="snap-guide" id="snap-guide" hidden></div>
          </div>
        </div>
      </div>
    </section>

    <script src="renderer.js"></script>
  </body>
</html>
